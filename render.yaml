services:
  - type: web
    name: alfalqi-pdf-ocr
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: MAX_PDF_PAGES
        value: "12"
      - key: MAX_CONVERT_PAGES
        value: "20"
      - key: OCR_DPI
        value: "240"
      - key: CORS_ORIGINS
        value: "*"
