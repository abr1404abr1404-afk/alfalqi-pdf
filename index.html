<!DOCTYPE html>
<html lang="ar" dir="rtl">

<style>
:root{--bg:#e8ebf0;--panel:#fff;--ink:#1c2433;--mut:#5d6778;--line:#d3d9e2;--acc:#0f766e;--accfg:#fff;--danger:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;min-height:100vh}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:8px;align-items:center}header>*{flex:none;white-space:nowrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:10}
button,label.btn{white-space:nowrap;flex:none;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:focus-visible,label.btn:focus-within{outline:2px solid var(--acc);outline-offset:2px}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button.on{background:var(--ink);color:var(--panel)}
button:disabled{opacity:.45;cursor:default}
.sp{flex:1}
#info{color:var(--mut);font-size:.9rem}
main{padding:16px 10px 60px;overflow-x:auto}
#empty{margin-top:12vh;text-align:center;max-width:380px;line-height:1.8;color:var(--mut)}
#empty h1{color:var(--ink);font-size:1.5rem;margin:0 0 6px}
.drop #empty{color:var(--acc)}
.card{width:max-content;margin:0 auto 18px}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:.9rem;color:var(--mut)}
.bar button{padding:4px 9px}
.bar .x{color:var(--danger)}
.wrap{position:relative;direction:ltr;box-shadow:0 1px 6px rgba(0,0,0,.25);background:#fff;overflow:hidden}
.wrap.sel{outline:3px solid var(--acc)}
.wrap canvas{display:block;max-width:100%}
.wrap.add{cursor:text}
.ov{position:absolute;color:#000;font-family:"IBM Plex Sans Arabic",Arial,sans-serif;line-height:1.2;display:flex;align-items:flex-start;gap:3px}.ov.sel{outline:1px dashed var(--acc)}.ov:not(.sel) .m,.ov:not(.sel) .d{display:none}.ov .t{white-space:pre;min-width:24px;outline:none;unicode-bidi:plaintext}.ov .d{flex:none;width:20px;height:20px;padding:0;border-radius:50%;background:var(--danger);color:#fff;border:0;font-size:13px;line-height:1;font-family:system-ui,sans-serif}
.ov .m{flex:none;width:20px;height:20px;padding:0;border-radius:50%;background:var(--acc);color:var(--accfg);border:0;font-size:12px;line-height:1;cursor:grab;touch-action:none;font-family:system-ui,sans-serif}select,input[type=color]{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:4px 6px;height:36px}input[type=color]{width:42px;padding:2px}
.ov .tb{position:absolute;left:0;bottom:100%;margin-bottom:6px;display:none;align-items:center;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25);font:13px system-ui,"IBM Plex Sans Arabic",sans-serif;color:var(--ink);line-height:1;white-space:nowrap;z-index:3;direction:rtl}.ov.sel .tb{display:flex}.ov.below .tb{bottom:auto;top:100%;margin:6px 0 0}.ov .tb button,.ov .tb select,.ov .tb input{height:30px;font-size:13px;padding:0 7px;border-radius:7px}.ov .tb .m,.ov .tb .d{width:30px;padding:0;border-radius:7px}.ov .tb select{max-width:96px}.ov .tb input[type=color]{width:34px;padding:2px}.ov .tb .sz{min-width:20px;text-align:center}
.det{position:absolute;z-index:1;cursor:text;pointer-events:none}body.editing .det{pointer-events:auto;outline:1px dashed var(--acc);background:rgba(15,118,110,.1)}body.editing .det:hover{background:rgba(15,118,110,.25)}.cover{position:absolute;background:#fff;z-index:1}.ov{z-index:2}
.im{position:absolute;z-index:2;touch-action:none;cursor:move}.im img{display:block;width:100%;pointer-events:none;user-select:none}.im.sel{outline:2px solid var(--acc)}.im .rz{display:none;position:absolute;right:-10px;bottom:-10px;width:22px;height:22px;border-radius:50%;background:var(--acc);border:2px solid var(--panel);cursor:nwse-resize;touch-action:none}.im.sel .rz{display:block}.im .tb{position:absolute;left:0;bottom:100%;margin-bottom:6px;display:none;align-items:center;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:3;cursor:default}.im.sel .tb{display:flex}.im.below .tb{bottom:auto;top:100%;margin:6px 0 0}.im .tb button{height:30px;min-width:32px;font-size:15px;padding:0 8px;border-radius:7px}
#sg{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}#sg.on{display:flex}#sg .bx{background:var(--panel);border-radius:14px;padding:14px;width:min(100%,460px)}#sgc{width:100%;height:200px;background:#fff;border:1px solid var(--line);border-radius:10px;touch-action:none;display:block;cursor:crosshair}#sg .r{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}#sg h2{margin:0 0 4px;font-size:1.1rem}#sg p{margin:0 0 10px;color:var(--mut);font-size:.9rem}
:root{--bg:#e3e8ef;--line:#cfd6e1}body{-webkit-font-smoothing:antialiased}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{padding:8px 14px;gap:10px;box-shadow:0 4px 18px rgba(16,24,40,.07)}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:6px}.logo{width:36px;height:36px;border-radius:11px;background:var(--acc);color:var(--accfg);display:grid;place-items:center}.logo .ic{width:20px;height:20px}
.nm{font-weight:700;font-size:1.05rem;line-height:1.15}.nm small{display:block;font-weight:400;color:var(--mut);font-size:.72rem}
.grp{display:flex;align-items:center;gap:2px;padding:3px;background:var(--bg);border-radius:12px}
.hb{background:transparent;border:0;height:36px;padding:0 11px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-size:.9rem}.hb:hover{background:var(--panel)}.hb.on{background:var(--acc);color:var(--accfg)}
#zv{min-width:50px;text-align:center;font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--mut)}
button.p{height:40px;padding:0 18px;border-radius:11px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(15,118,110,.35)}
#empty{margin:8vh auto 0;max-width:480px;text-align:center;background:var(--panel);border:2px dashed var(--line);border-radius:22px;padding:38px 24px;color:var(--mut);line-height:1.8}
.drop #empty{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--panel))}
#empty .lg{width:68px;height:68px;margin:0 auto 14px;border-radius:20px;background:var(--acc);color:var(--accfg);display:grid;place-items:center}#empty .lg .ic{width:34px;height:34px}
#empty h1{font-size:1.6rem;margin:0 0 8px}
.cta{display:inline-flex;align-items:center;justify-content:center;background:var(--acc);color:var(--accfg);border-color:var(--acc);height:46px;padding:0 26px;border-radius:12px;font-weight:600;margin:14px 0 18px;box-shadow:0 2px 10px rgba(15,118,110,.35)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chips span{background:var(--bg);border-radius:999px;padding:3px 13px;font-size:.84rem}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:4px 8px;margin-bottom:8px;width:max-content;max-width:100%;color:var(--ink);font-weight:600}
.bar button{background:transparent;border-color:transparent;font-weight:400}.bar button:hover{background:var(--bg)}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
.wrap{box-shadow:0 6px 24px rgba(16,24,40,.2);border-radius:2px}
#sg .bx{border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
@media (max-width:860px){.lb,.nm small{display:none}.hb{padding:0 10px}header{padding:8px 10px;gap:8px}}
#fn{height:40px;width:180px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink)}#fn:focus{outline:2px solid var(--acc);outline-offset:1px}@media (max-width:860px){#fn{width:130px}}
.ov .tb,.im .tb{position:fixed;margin:0;bottom:auto;left:0;top:0;max-width:calc(100vw - 8px);overflow-x:auto}.ov.below .tb,.im.below .tb{margin:0;bottom:auto}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;display:none;z-index:20;max-width:90%}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14h6M9 17h4"/></svg></span><span class="nm">الفلقي<small>لتعديل PDF</small></span></div>
  <div class="grp"><label class="btn hb" title="فتح / إضافة ملفات PDF"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="lb">فتح</span><input id="file" type="file" accept="application/pdf" multiple hidden></label><label class="btn hb" title="تحويل صورة إلى PDF"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span class="lb">صورة</span><input id="fimg" type="file" accept="image/*" multiple hidden></label></div>

  <div class="grp"><button class="hb" id="ud" title="تراجع (Ctrl+Z)" aria-label="تراجع" disabled><svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span class="lb">تراجع</span></button><button class="hb" id="rd" title="إعادة (Ctrl+Y)" aria-label="إعادة" disabled><svg class="ic" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span class="lb">إعادة</span></button></div>
  <div class="grp">
   <button class="hb" id="txt" title="إضافة نص"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg><span class="lb">إضافة نص</span></button>
   <button class="hb" id="edt" title="تعديل النص الموجود"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="lb">تعديل النص</span></button>
   <label class="btn hb" title="إضافة صورة"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span class="lb">صورة</span><input id="img" type="file" accept="image/png,image/jpeg" hidden></label>
   <button class="hb" id="sig" title="توقيع"><svg class="ic" viewBox="0 0 24 24"><path d="M3 17c3 0 4-8 7-8s1 8 4 8 3-4 7-4"/></svg><span class="lb">توقيع</span></button>
   <button class="hb" id="pn" title="ترقيم الصفحات بأرقام عربية"><svg class="ic" viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg><span class="lb">ترقيم</span></button>
  </div>
  
  <span class="sp"></span>
  <span id="info"></span>
  <input id="fn" type="text" dir="auto" placeholder="اسم الملف" aria-label="اسم الملف قبل الحفظ" autocomplete="off"><button id="save" class="p" disabled><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 21h16"/></svg><span id="svl">تنزيل</span></button>
</header>
<main id="main">
  <div id="empty"><div class="lg"><svg class="ic" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14h6M9 17h4"/></svg></div><h1>الفلقي لتعديل PDF</h1><div>اسحب ملف PDF هنا أو اختره من جهازك. كل شيء يتم داخل المتصفح ولا تُرفع ملفاتك إلى أي مكان.</div><label for="file" class="btn cta">فتح ملف PDF</label><br><label for="fimg" class="btn cta" style="background:var(--bg);color:var(--ink);border-color:var(--line);margin-top:0;box-shadow:none">تحويل صورة إلى PDF</label><div class="chips"><span>تحويل الصور إلى PDF</span><span>دمج الملفات</span><span>تعديل النص الموجود</span><span>صور وتوقيع</span><span>ترقيم عربي</span><span>ترتيب وتدوير وحذف</span></div></div>
</main>
<div id="sg"><div class="bx" role="dialog" aria-label="التوقيع"><h2>ارسم توقيعك</h2><p>ارسم بإصبعك أو بالفأرة داخل المربع الأبيض.</p><canvas id="sgc"></canvas><div class="r"><input id="sgcol" type="color" value="#111111" aria-label="لون التوقيع"><button id="sgx">مسح</button><span class="sp"></span><button id="sgn">إلغاء</button><button id="sgok" class="p">إدراج</button></div></div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script type="text/plain" id="imgmod">
(function(){
const A4=842/595;
function loadTess(){if(window.Tesseract)return Promise.resolve();return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=res;s.onerror=()=>rej(new Error("لا يوجد اتصال"));document.head.append(s)})}
const MIME={jpg:"image/jpeg",jpeg:"image/jpeg",jfif:"image/jpeg",png:"image/png",gif:"image/gif",webp:"image/webp",bmp:"image/bmp",avif:"image/avif",heic:"image/heic",heif:"image/heif",tif:"image/tiff",tiff:"image/tiff",svg:"image/svg+xml",ico:"image/x-icon"};
async function decode(f){
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  try{if(window.createImageBitmap){const bm=await createImageBitmap(f);return{el:bm,w:bm.width,h:bm.height}}}catch(e){}
  let du=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("تعذّرت قراءة الملف"));r.readAsDataURL(f)});
  if(!/^data:image\//.test(du)&&MIME[ext])du=du.replace(/^data:[^,]*,/,"data:"+MIME[ext]+";base64,");
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("x"));i.src=du});
    return{el:im,w:im.naturalWidth||im.width,h:im.naturalHeight||im.height};
  }catch(e){
    const heic=/hei[cf]/.test(ext)||/hei[cf]/.test(f.type);
    throw new Error("الصيغة غير مدعومة في متصفحك ("+(ext||f.type||"؟")+")"+(heic?"، حوّل الصورة إلى JPG أو اجعل إعداد الكاميرا «الأكثر توافقًا»":""));
  }
}
async function toPdf(f){
  const d0=await decode(f),W=d0.w,H=d0.h;
  if(!W||!H)throw new Error("الصورة فارغة");
  const sc=Math.min(1,2400/Math.max(W,H)),cw=Math.max(1,Math.round(W*sc)),ch=Math.max(1,Math.round(H*sc));
  const c=document.createElement("canvas");c.width=cw;c.height=ch;
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cw,ch);g.drawImage(d0.el,0,0,cw,ch);
  let blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.9));
  if(!blob){const b64=c.toDataURL("image/jpeg",.9).split(",")[1];blob=new Blob([Uint8Array.from(atob(b64),x=>x.charCodeAt(0))],{type:"image/jpeg"})}
  const bytes=new Uint8Array(await blob.arrayBuffer()),r=ch/cw;let pw,ph;
  if(r>=1){pw=595;ph=Math.abs(r-A4)/A4<.08?842:Math.round(595*r)}
  else{ph=595;pw=Math.abs(1/r-A4)/A4<.08?842:Math.round(595/r)}
  const d=await PDFLib.PDFDocument.create(),im=await d.embedJpg(bytes);
  d.addPage([pw,ph]).drawImage(im,{x:0,y:0,width:pw,height:ph});
  return {pdf:await d.save(),src:{blob,kx:pw/cw,ky:ph/ch}};
}
window.imgLoad=async function(files){
  for(const f of files){
    try{
      toast("جارٍ تحويل «"+f.name+"» إلى PDF…");
      const t=await toPdf(f),before=pages.length;
      await load([new File([t.pdf],f.name.replace(/\.[^.]*$/,"")+".pdf",{type:"application/pdf"})]);
      if(pages.length>before){pages[before].src=t.src;render();toast("تم تحويل الصورة إلى PDF بحجم الورقة. لتحليل نصها اضغط «تحليل النص» فوق الصفحة.")}
    }catch(e){console.error(e);toast("تعذّر تحويل «"+f.name+"»: "+((e&&e.message)||e))}
  }
};
window.imgOcr=async function(pg){
  if(window.ocrBusy)return toast("يوجد تحليل جارٍ، انتظر حتى ينتهي.");
  window.ocrBusy=true;
  try{
    toast("جارٍ تحليل النص… قد يستغرق دقيقة في أول مرة.");
    await loadTess();
    const w=await Tesseract.createWorker(["ara","eng"]);
    const {data}=await w.recognize(pg.src.blob);
    await w.terminate();
    const {kx,ky}=pg.src;
    pg.ocr=(data.lines||[]).filter(l=>l.text.trim()&&l.confidence>35).map(l=>({t:l.text.trim().replace(/\s+/g," "),x0:l.bbox.x0*kx,x1:l.bbox.x1*kx,y0:l.bbox.y0*ky,y1:l.bbox.y1*ky}));
    render();
    toast(pg.ocr.length?"تم التعرّف على "+pg.ocr.length+" سطرًا. فعّل «تعديل النص» واضغط أي سطر لتعديله.":"لم أجد نصًا في الصورة.");
  }catch(e){console.error(e);toast("تعذّر تحليل النص: يحتاج إنترنت ولا يعمل داخل تطبيق Claude، افتح الملف مباشرة من Safari. ("+((e&&e.message)||e)+")")}
  finally{window.ocrBusy=false}
};
})();
</script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const $=id=>document.getElementById(id);
const docs=[];            // {bytes, pdf}

  if(!inked)return toast("ارسم توقيعك أولًا.");
  const W=sc.width,H=sc.height,d=sk.getImageData(0,0,W,H).data;let x0=W,y0=H,x1=0,y1=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(d[(y*W+x)*4+3]>0){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  const p=8;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(W-1,x1+p);y1=Math.min(H-1,y1+p);
  const c=document.createElement("canvas");c.width=x1-x0+1;c.height=y1-y0+1;c.getContext("2d").drawImage(sc,x0,y0,c.width,c.height,0,0,c.width,c.height);
  c.toBlob(b=>{sg.classList.remove("on");putImg(new File([b],"sig.png",{type:"image/png"}),.25);toast("اسحب التوقيع لمكانه وغيّر حجمه بالدائرة الخضراء.")},"image/png");
};
const HU=[],HR=[];let hLast=null,hP=null;
const hJ=()=>JSON.stringify(pages.map(p=>[p.d,p.i,p.rot,p.nat,p.ov.filter(o=>o.t.trim()||o.cover),(p.img||[]).map(({b,u,fresh,...r})=>r)]));
const hC=()=>pages.map(p=>({...p,sel:false,ov:JSON.parse(JSON.stringify(p.ov.filter(o=>o.t.trim()||o.cover))),img:(p.img||[]).map(im=>({...im,fresh:0}))}));
const updUR=()=>{$("ud").disabled=!HU.length;$("rd").disabled=!HR.length};
function track(){const j=hJ();if(j===hLast)return;if(hLast!==null){HU.push({j:hLast,p:hP});if(HU.length>100)HU.shift()}hLast=j;hP=hC();HR.length=0;updUR()}
function hApply(s){pages=s.p.map(p=>({...p,sel:false,ov:JSON.parse(JSON.stringify(p.ov)),img:p.img.map(im=>({...im}))}));hLast=s.j;hP=hC();cur=null;render();updUR()}
function undo(){track();if(!HU.length)return;HR.push({j:hLast,p:hP});hApply(HU.pop())}
function redo(){if(!HR.length)return;HU.push({j:hLast,p:hP});hApply(HR.pop())}
$("ud").onclick=undo;$("rd").onclick=redo;
["pointerup","click","change","focusout"].forEach(ev=>addEventListener(ev,()=>setTimeout(track,60),true));
let hT;addEventListener("input",()=>{clearTimeout(hT);hT=setTimeout(track,700)},true);
addEventListener("keydown",e=>{if(!(e.ctrlKey||e.metaKey)||e.target.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const k=e.key.toLowerCase();if(k==="z"){e.preventDefault();e.shiftKey?redo():undo()}else if(k==="y"){e.preventDefault();redo()}});
track();
let editing=false;$("edt").onclick=()=>{editing=!editing;document.body.classList.toggle("editing",editing);$("edt").classList.toggle("on",editing);if(editing)toast("اضغط على أي سطر نصّي في الملف لتعديله. زر × يحذف السطر.")};
$("txt").onclick=()=>{addMode=!addMode;$("txt").classList.toggle("on",addMode);document.querySelectorAll(".wrap").forEach(w=>w.classList.toggle("add",addMode));if(addMode)toast("اضغط على الصفحة في المكان الذي تريد الكتابة فيه. زر × يحذف النص.")};

async function textPng(txt,o){
  try{await document.fonts.load((o.b?"700 ":"")+"28px "+FONTS[o.f][1],txt)}catch(e){}
  const K=4,f=o.s*K,lh=f*1.2,lines=txt.replace(/\s+$/,"").split("\n"),c=document.createElement("canvas"),g=c.getContext("2d");
  const font=(o.b?"700 ":"")+f+"px "+FONTS[o.f][1]+",Arial,sans-serif",rtl=l=>/[\u0590-\u08FF]/.test(l);
  g.font=font;
  const wd=Math.max(...lines.map(l=>g.measureText(l).width),1);
  c.width=Math.ceil(wd+4);c.height=Math.ceil(lh*lines.length);
  g.font=font;g.fillStyle=o.c;g.textBaseline="middle";
  lines.forEach((l,k)=>{const r=rtl(l);g.direction=r?"rtl":"ltr";g.textAlign=r?"right":"left";g.fillText(l,r?c.width-2:2,lh*k+lh/2)});
  const blob=await new Promise(r=>c.toBlob(r,"image/png"));
  return {data:new Uint8Array(await blob.arrayBuffer()),w:c.width/K,h:c.height/K};
}
$("save").onclick=async()=>{
  const {PDFDocument,StandardFonts,degrees,rgb}=PDFLib;
  const sel=pages.filter(p=>p.sel),list=sel.length?sel:pages;
  try{
    const out=await PDFDocument.create(),cache={};
    for(const pg of list){
      cache[pg.d]??=await PDFDocument.load(docs[pg.d].bytes,{ignoreEncryption:true});
      const [cp]=await out.copyPages(cache[pg.d],[pg.i-1]);
      cp.setRotation(degrees((pg.nat+pg.rot)%360));out.addPage(cp);
      const {width:w,height:h}=cp.getSize();
      for(const o of pg.ov){if(!o.cover)continue;const c=o.cover;cp.drawRectangle({x:c.x*w,y:h-(c.y+c.h)*h,width:c.w*w,height:c.h*h,color:rgb(...[1,3,5].map(i=>parseInt((c.bg||"#ffffff").slice(i,i+2),16)/255)),borderWidth:0})}
      for(const im of pg.img||[]){const e=im.m==="image/png"?await out.embedPng(im.b):await out.embedJpg(im.b),ww=im.w*w,hh=ww*im.r;cp.drawImage(e,{x:im.x*w,y:h-im.y*h-hh,width:ww,height:hh})}
      for(const o of pg.ov){
        if(!o.t.trim())continue;
        const im=await textPng(o.t,o),img=await out.embedPng(im.data);
        cp.drawImage(img,{x:o.x*w,y:h-o.y*h-im.h,width:im.w,height:im.h});
      }
    }
    const bytes=await out.save();
    const fname=(($("fn").value.trim().replace(/[\\/:*?"<>|]+/g,"-").replace(/\.pdf$/i,""))||"document")+".pdf";
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));a.download=fname;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  }catch(e){if(e&&e.code==="declined")return;toast("تعذّر إنشاء الملف.")}
};
render();
