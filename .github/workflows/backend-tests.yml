name: Backend quality checks
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements-test.txt
      - run: python -m compileall -q backend/main.py backend/quality_metrics.py
      - run: PYTHONPATH=backend pytest -q backend/tests
